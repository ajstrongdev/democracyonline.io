name: Deploy VPS

on:
  push:
    branches:
      - revival
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: Dev
        type: choice
        options:
          - Dev
          - Prod

concurrency:
  group: deploy-vps-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Dev' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd '${{ secrets.VPS_APP_DIR }}'
            git fetch --prune origin revival
            git checkout revival
            git reset --hard origin/revival
            git clean -fd

            if [ '${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Dev' }}' = 'Prod' ]; then
              pnpm deploy:prod
            else
              pnpm deploy:dev
            fi
