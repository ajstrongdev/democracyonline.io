name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: Dev
        type: choice
        options:
          - Dev
          - Prod

concurrency:
  group: deploy-vps-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            # Each environment is its own checkout with its own .env, so the
            # same commands deploy either one. VPS_PROD_DIR / VPS_DEV_DIR are
            # per-environment secrets defaulting to the bootstrap layout.
            if [ '${{ inputs.environment }}' = 'Prod' ]; then
              DIR='${{ secrets.VPS_PROD_DIR }}'
              [ -n "$DIR" ] || DIR='/srv/democracyonline-prod'
            else
              DIR='${{ secrets.VPS_DEV_DIR }}'
              [ -n "$DIR" ] || DIR='/srv/democracyonline-dev'
            fi
            cd "$DIR"
            # Preserve the branch currently selected in this checkout. The
            # update script refuses dirty or detached checkouts and pulls only
            # a fast-forward from that branch's origin counterpart.
            pnpm update
