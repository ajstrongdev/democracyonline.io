name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_FIREBASE_API_KEY: dummy-for-ci
          VITE_FIREBASE_AUTH_DOMAIN: dummy-for-ci
          VITE_FIREBASE_PROJECT_ID: dummy-for-ci
          VITE_FIREBASE_STORAGE_BUCKET: dummy-for-ci
          VITE_FIREBASE_MESSAGING_SENDER_ID: dummy-for-ci
          VITE_FIREBASE_APP_ID: dummy-for-ci
