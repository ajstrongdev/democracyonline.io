services:
  app:
    environment:
      NODE_ENV: production
      DEPLOYED_ENV: development
      SITE_URL: ${SITE_URL}
      DATABASE_URL: ${DATABASE_URL}
      BILL_ADVANCE_SCHEDULE_UTC: ${BILL_ADVANCE_SCHEDULE_UTC:-*/5 * * * *}
      GAME_ADVANCE_SCHEDULE_UTC: ${GAME_ADVANCE_SCHEDULE_UTC:-*/20 * * * *}
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

  election-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      CRON_INTERNAL_TOKEN: ${CRON_INTERNAL_TOKEN}
    depends_on:
      - app
    command:
      - node
      - -e
      - >-
        const target = 'http://app:3000/api/election-advance';
        const token = process.env.CRON_INTERNAL_TOKEN;
        async function tick() {
        try { const response = await fetch(target, { method: 'POST', headers: { 'x-internal-cron-token': token } }); if (!response.ok) console.error(`[election-scheduler] $${response.status}`); } catch (error) { console.error('[election-scheduler]', error); } setTimeout(tick, 1000); }
        tick();
    restart: unless-stopped
