services:
  app:
    environment:
      NODE_ENV: production
      DEPLOYED_ENV: development
      SITE_URL: ${SITE_URL}
      DATABASE_URL: ${DATABASE_URL}
      BILL_ADVANCE_SCHEDULE_UTC: ${BILL_ADVANCE_SCHEDULE_UTC:-*/5 * * * *}
      GAME_ADVANCE_SCHEDULE_UTC: ${GAME_ADVANCE_SCHEDULE_UTC:-*/20 * * * *}
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
